<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=853, initial-scale=1">

  <title>MoeKoe Air · 我的 · 未登录候选稿 v2</title>
  <style>
    :root {
      --primary: #1677f2;
      --primary-deep: #0968df;
      --primary-soft: #edf5ff;
      --surface: #fffefa;
      --surface-soft: #f7faff;
      --outline: #dce3ec;
      --text: #191b20;
      --muted: #747b87;
      --disabled: #a2a8b2;
      --gold: #b67616;
      --gold-soft: #fff8e8;
      --pink: #ef4667;
      --purple: #6b51e8;
      --mint: #08b897;
      --red: #ee525c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 853px;
      height: 1844px;
      overflow: hidden;
      background: var(--surface);
      color: var(--text);
      font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 15% 9%, rgba(22,119,242,.035), transparent 25%),
        linear-gradient(180deg, #fffefa 0%, #ffffff 56%, #fcfdff 100%);
    }

    svg { display: block; }
    button { font: inherit; }

    .page {
      position: absolute;
      inset: 0;
      padding: 65px 30px 0;
    }

    .account-card {
      position: relative;
      width: 793px;
      height: 366px;
      border: 1.5px solid #cfe0f4;
      border-radius: 34px;
      background:
        radial-gradient(circle at 86% 15%, rgba(255,255,255,.98) 0 9%, transparent 26%),
        linear-gradient(118deg, #f2f7ff 0%, #fbfdff 50%, #f5f9ff 100%);
      box-shadow: 0 18px 44px rgba(27,91,165,.055), inset 0 1px 0 rgba(255,255,255,.95);
      overflow: hidden;
    }

    .account-card::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -78px;
      top: -105px;
      border-radius: 50%;
      border: 42px solid rgba(22,119,242,.028);
    }

    .identity {
      position: absolute;
      left: 38px;
      top: 48px;
      display: flex;
      align-items: center;
      gap: 27px;
      z-index: 1;
    }

    .avatar {
      position: relative;
      width: 154px;
      height: 154px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #e4f1ff, #fbfdff);
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #b9d7fa, 0 12px 28px rgba(22,119,242,.12);
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2087ff, #0a69e9);
    }

    .avatar svg { position: relative; z-index: 1; }

    .identity-copy { padding-top: 3px; }

    .identity-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 13px;
    }

    .identity-title h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1.18;
      font-weight: 660;
      letter-spacing: -.7px;
    }

    .login-chip {
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 17px;
      border-radius: 22px;
      background: var(--primary);
      color: white;
      font-size: 21px;
      font-weight: 590;
      box-shadow: 0 6px 16px rgba(22,119,242,.17);
    }

    .identity-copy p {
      margin: 0;
      color: #6b7480;
      font-size: 24px;
      line-height: 1.45;
      letter-spacing: .1px;
    }

    .settings {
      position: absolute;
      top: 28px;
      right: 22px;
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #31343a;
      background: rgba(255,255,255,.93);
      box-shadow: 0 6px 16px rgba(37,52,70,.13);
      z-index: 2;
    }

    .benefits {
      position: absolute;
      left: 38px;
      right: 38px;
      bottom: 36px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      z-index: 1;
    }

    .benefit {
      height: 79px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 22px;
      font-size: 27px;
      font-weight: 570;
      background: rgba(255,255,255,.55);
    }

    .benefit.checkin {
      color: #3478ca;
      border: 1.5px solid #a9cdf9;
      background: rgba(237,245,255,.84);
    }

    .benefit.vip {
      color: #9a671c;
      border: 1.5px solid #f1c76d;
      background: rgba(255,248,232,.86);
    }

    .benefit small {
      font-size: 17px;
      font-weight: 520;
      opacity: .67;
      margin-left: -6px;
    }

    .quick-card {
      position: absolute;
      left: 30px;
      top: 455px;
      width: 793px;
      height: 247px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      border: 1.5px solid #e2e6ec;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 14px 34px rgba(37,51,71,.035);
    }

    .asset {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }

    .asset-icon {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eef5ff;
      color: var(--primary);
      margin-bottom: 17px;
    }

    .asset.muted .asset-icon {
      background: #f1f4f8;
      color: #87909c;
    }

    .asset strong {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 560;
      white-space: nowrap;
    }

    .asset span {
      margin-top: 12px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1;
      white-space: nowrap;
    }

    .section-title {
      position: absolute;
      left: 42px;
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 620;
      letter-spacing: -.2px;
    }

    .collection-title { top: 744px; }
    .playlist-title { top: 1068px; }

    .collection-card {
      position: absolute;
      left: 33px;
      top: 795px;
      width: 787px;
      height: 228px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      border: 1.5px solid #e2e6ec;
      border-radius: 28px;
      background: rgba(255,255,255,.91);
      box-shadow: 0 12px 30px rgba(37,51,71,.03);
    }

    .collection-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .collection-item:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 14px;
      height: 151px;
      width: 1px;
      background: #e4e7ec;
    }

    .square-icon {
      width: 91px;
      height: 91px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      margin-bottom: 16px;
    }

    .pink { color: var(--pink); background: #fff0f4; }
    .purple { color: var(--purple); background: #f2efff; }
    .mint { color: var(--mint); background: #eafaf6; }
    .red { color: var(--red); background: #fff0f0; }

    .collection-item strong {
      font-size: 23px;
      line-height: 1.2;
      font-weight: 560;
      white-space: nowrap;
    }

    .collection-item span {
      margin-top: 10px;
      color: #7b828d;
      font-size: 18px;
      white-space: nowrap;
    }

    .playlist-empty {
      position: absolute;
      left: 34px;
      top: 1123px;
      width: 785px;
      height: 218px;
      display: flex;
      align-items: center;
      padding: 0 44px;
      border-radius: 28px;
      border: 1.5px solid #e2e8f0;
      background:
        radial-gradient(circle at 12% 50%, rgba(22,119,242,.08), transparent 27%),
        linear-gradient(105deg, #f8fbff, #fff);
      overflow: hidden;
    }

    .empty-mark {
      position: relative;
      flex: 0 0 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      color: var(--primary);
      background: linear-gradient(145deg, #e7f2ff, #f5f9ff);
      box-shadow: inset 0 0 0 1px rgba(22,119,242,.08);
    }

    .empty-mark::after {
      content: "";
      position: absolute;
      width: 27px;
      height: 27px;
      right: 7px;
      bottom: 7px;
      border-radius: 50%;
      border: 6px solid #f4f9ff;
      background: var(--primary);
    }

    .empty-copy { margin-left: 30px; }

    .empty-copy strong {
      display: block;
      margin-bottom: 10px;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 600;
    }

    .empty-copy span {
      display: block;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
    }

    .empty-login {
      margin-left: auto;
      height: 52px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      border-radius: 27px;
      border: 1.5px solid #9ec9ff;
      color: var(--primary-deep);
      background: #f1f7ff;
      font-size: 20px;
      font-weight: 580;
      white-space: nowrap;
    }

    .mini-player {
      position: absolute;
      left: 31px;
      top: 1562px;
      width: 791px;
      height: 133px;
      border: 1.5px solid #dfe3e9;
      border-radius: 24px;
      background: rgba(249,250,252,.96);
      box-shadow: 0 10px 30px rgba(35,48,68,.06);
      overflow: hidden;
    }

    .cover {
      position: absolute;
      left: 16px;
      top: 14px;
      width: 86px;
      height: 86px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 66% 29%, #fff 0 8%, transparent 9%),
        radial-gradient(circle at 61% 43%, #f8d8c8 0 17%, transparent 18%),
        linear-gradient(145deg, transparent 0 42%, rgba(255,255,255,.72) 43% 49%, transparent 50%),
        linear-gradient(145deg, #e6c4ae 0%, #9cc7ed 47%, #edf5ff 100%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
    }

    .track-copy {
      position: absolute;
      left: 126px;
      top: 22px;
      width: 340px;
    }

    .track-title {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 560;
    }

    .quality {
      padding: 2px 8px 3px;
      border: 1.5px solid var(--primary);
      border-radius: 8px;
      color: var(--primary);
      font-size: 14px;
      line-height: 1;
    }

    .artist {
      margin-top: 10px;
      color: #767b84;
      font-size: 18px;
    }

    .player-controls {
      position: absolute;
      right: 22px;
      top: 31px;
      display: flex;
      align-items: center;
      gap: 29px;
    }

    .play {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--primary);
      box-shadow: 0 7px 18px rgba(22,119,242,.19);
    }

    .progress {
      position: absolute;
      left: 66px;
      right: 77px;
      bottom: 17px;
      height: 3px;
      background: #dfe3e8;
    }

    .progress::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 38%;
      height: 3px;
      background: var(--primary);
    }

    .time {
      position: absolute;
      bottom: 8px;
      color: #747b85;
      font-size: 14px;
    }
    .time.start { left: 18px; }
    .time.end { right: 22px; }

    .bottom-nav {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 853px;
      height: 139px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1.5px solid #e1e5ea;
      background: rgba(251,252,254,.98);
    }

    .nav-item {
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #71757c;
      font-size: 17px;
      line-height: 1;
    }

    .nav-item.selected { color: var(--primary); font-weight: 560; }

    .nav-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <main class="page" aria-label="MoeKoe Air 我的页面未登录设计稿">
