name: Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure deterministic runner locale and timezone
        shell: bash
        run: |
          locale -a | grep -Eiq '^en_US\.UTF-8$'
          test "$(LC_ALL=en_US.UTF-8 locale charmap)" = "UTF-8"
          test "$(TZ=UTC date +%Z)" = "UTC"
          printf '%s\n' 'LANG=en_US.UTF-8' 'LC_ALL=en_US.UTF-8' 'TZ=UTC' >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Verify development contracts
        run: ./gradlew :build-logic:test verifyArchitecture verifyUiContracts verifySkillGovernance

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p build
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha="HEAD^"
          fi
          git diff --name-status "$base_sha" HEAD > build/changed-files.txt

      - name: Validate screenshots and design fidelity
        run: >-
          ./gradlew --no-configuration-cache
          validateDebugScreenshotTest
          verifyUiFidelity
          verifyUiImpact
          verifyUiGoldenChange
          -Pmoekoe.changedFilesFile=build/changed-files.txt

      - name: Upload screenshot diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/screenshotTest/**
            **/build/test-results/validateDebugScreenshotTest/**
            **/build/outputs/screenshotTest-results/**
            build/reports/ui-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build Debug APK
        run: ./gradlew assembleDebug
